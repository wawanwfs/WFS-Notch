[package]
name = "wfs-notch"
version = "0.24.0"
description = "WFS Notch — original Windows interactive notch implementation"
authors = ["WFS"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

sysinfo = "=0.33.1"
tauri-plugin-notification = "2"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "UI_Notifications", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
